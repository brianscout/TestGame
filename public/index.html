<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Endless Stack</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #15151c;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff;
    user-select: none; -webkit-user-select: none; touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }
  #hud {
    position: fixed; top: 0; left: 0; right: 0; padding-top: 6vh;
    text-align: center; pointer-events: none;
  }
  #score {
    font-size: clamp(48px, 12vw, 88px); font-weight: 800; line-height: 1;
    text-shadow: 0 2px 16px rgba(0,0,0,.25); font-variant-numeric: tabular-nums;
  }
  #overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px;
    text-align: center; pointer-events: none; padding: 0 16px;
  }
  #overlay h1 {
    margin: 0; font-size: clamp(36px, 9vw, 64px); font-weight: 800; letter-spacing: -.02em;
    text-shadow: 0 2px 16px rgba(0,0,0,.3);
  }
  #overlay p { margin: 0; font-size: clamp(15px, 4vw, 19px); opacity: .9; }
  #overlay .big { font-size: clamp(22px, 6vw, 30px); font-weight: 700; opacity: 1; }
  #overlay .hint { margin-top: 18px; opacity: .75; animation: blink 1.6s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .3; } }
  #mute {
    position: fixed; top: 14px; right: 14px; width: 40px; height: 40px;
    border: 0; border-radius: 50%; background: rgba(255,255,255,.15); color: #fff;
    font-size: 18px; cursor: pointer;
  }
  #mute:hover { background: rgba(255,255,255,.25); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="hidden"><div id="score">0</div></div>
<div id="overlay">
  <h1>Endless Stack</h1>
  <p>Drop each block on the tower. Overhang gets sliced off.</p>
  <p class="hint">Click, tap or press Space to start</p>
</div>
<button id="mute" title="Mute (M)" aria-label="Toggle sound">🔊</button>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const hud = document.getElementById('hud');
  const scoreEl = document.getElementById('score');
  const overlay = document.getElementById('overlay');
  const muteBtn = document.getElementById('mute');

  // World units; the canvas is scaled so WORLD_W always fits on screen.
  const WORLD_W = 400;
  const BLOCK_H = 26;
  const BASE_W = 220;
  const PERFECT = 5;       // snap tolerance, world units
  const SLIDE_MARGIN = 30; // how far a block may slide past the world edge
  const GRAVITY = 1600;

  let dpr, scale, viewW, viewH, offX, groundY;

  function resize() {
    // Hidden or collapsed windows can report 0×0; clamp so scale never hits 0.
    const w = Math.max(innerWidth, 1), h = Math.max(innerHeight, 1);
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    scale = Math.min(w / (WORLD_W + 40), h / 720);
    viewW = w / scale;
    viewH = h / scale;
    offX = (viewW - WORLD_W) / 2;
    groundY = viewH - 90;
  }
  addEventListener('resize', resize);
  resize();

  // ---------- storage ----------
  function loadBest() {
    try { return parseInt(localStorage.getItem('endless-stack-best'), 10) || 0; } catch { return 0; }
  }
  function saveBest(v) {
    try { localStorage.setItem('endless-stack-best', String(v)); } catch {}
  }

  // ---------- sound ----------
  let actx = null;
  let muted = false;
  try { muted = localStorage.getItem('endless-stack-muted') === '1'; } catch {}
  muteBtn.textContent = muted ? '🔇' : '🔊';

  function tone(freq, dur = 0.12, type = 'triangle', vol = 0.15) {
    if (muted) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const t0 = actx.currentTime;
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(vol, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      o.connect(g).connect(actx.destination);
      o.start(t0);
      o.stop(t0 + dur);
    } catch {}
  }

  function toggleMute() {
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
    try { localStorage.setItem('endless-stack-muted', muted ? '1' : '0'); } catch {}
  }
  muteBtn.addEventListener('click', e => { e.stopPropagation(); toggleMute(); muteBtn.blur(); });

  // ---------- game state ----------
  let state = 'ready';   // ready | playing | over
  let stack, cur, debris, floaters, rings, cam, score, streak, hueBase, overAt;
  let best = loadBest();

  const hueOf = level => (hueBase + level * 7) % 360;
  const speedFor = level => Math.min(170 + level * 7, 520);

  function reset() {
    hueBase = Math.random() * 360;
    stack = [{ x: (WORLD_W - BASE_W) / 2, w: BASE_W }];
    debris = [];
    floaters = [];
    rings = [];
    cam = 0;
    score = 0;
    streak = 0;
    scoreEl.textContent = '0';
    spawn();
  }

  function spawn() {
    const top = stack[stack.length - 1];
    const fromLeft = stack.length % 2 === 1;
    cur = {
      x: fromLeft ? -SLIDE_MARGIN : WORLD_W - top.w + SLIDE_MARGIN,
      w: top.w,
      dir: fromLeft ? 1 : -1,
      speed: speedFor(stack.length),
    };
  }

  function start() {
    reset();
    state = 'playing';
    overlay.classList.add('hidden');
    hud.classList.remove('hidden');
  }

  function place() {
    const top = stack[stack.length - 1];
    const level = stack.length;
    const delta = cur.x - top.x;

    if (Math.abs(delta) <= PERFECT) {
      streak++;
      let x = top.x, w = top.w;
      // Reward perfect streaks by growing the block back toward full width.
      if (streak >= 3 && w < BASE_W) {
        const grow = Math.min(10, BASE_W - w);
        w += grow;
        x -= grow / 2;
      }
      stack.push({ x, w });
      rings.push({ x, w, level, life: 1 });
      floaters.push({ text: streak > 1 ? `Perfect ×${streak}` : 'Perfect!', x: x + w / 2, level, life: 1 });
      tone(440 * Math.pow(2, Math.min(streak, 15) / 12), 0.18, 'sine', 0.18);
    } else {
      const left = Math.max(cur.x, top.x);
      const right = Math.min(cur.x + cur.w, top.x + top.w);
      const overlap = right - left;

      if (overlap <= 0) {
        debris.push(makeDebris(cur.x, cur.w, level, cur.dir));
        cur = null;
        gameOver();
        return;
      }

      streak = 0;
      const cutX = delta > 0 ? right : cur.x;
      debris.push(makeDebris(cutX, cur.w - overlap, level, delta > 0 ? 1 : -1));
      stack.push({ x: left, w: overlap });
      tone(260 + Math.min(level, 40) * 4, 0.1, 'triangle', 0.14);
    }

    score++;
    scoreEl.textContent = score;
    spawn();
  }

  function makeDebris(x, w, level, dir) {
    return { x, w, h: (level + 1) * BLOCK_H, vx: dir * 50, vy: 0, rot: 0, vr: dir * 2.2, hue: hueOf(level) };
  }

  function gameOver() {
    state = 'over';
    overAt = performance.now();
    const isBest = score > best;
    if (isBest) { best = score; saveBest(best); }
    tone(140, 0.45, 'sawtooth', 0.12);
    hud.classList.add('hidden');
    overlay.innerHTML = `
      <h1>Game Over</h1>
      <p class="big">${score} block${score === 1 ? '' : 's'}</p>
      <p>${isBest && score > 0 ? 'New best!' : `Best: ${best}`}</p>
      <p class="hint">Click, tap or press Space to retry</p>`;
    overlay.classList.remove('hidden');
  }

  function action() {
    if (state === 'ready') start();
    else if (state === 'playing') place();
    else if (performance.now() - overAt > 450) start();
  }

  addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    e.preventDefault();
    action();
  });
  addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      if (!e.repeat) action();
    } else if (e.code === 'KeyM') {
      toggleMute();
    }
  });

  // ---------- update ----------
  function update(dt) {
    if (cur && state !== 'over') {
      cur.x += cur.dir * cur.speed * dt;
      const minX = -SLIDE_MARGIN, maxX = WORLD_W - cur.w + SLIDE_MARGIN;
      if (cur.x < minX) { cur.x = minX; cur.dir = 1; }
      else if (cur.x > maxX) { cur.x = maxX; cur.dir = -1; }
    }

    // Keep the top of the tower around 42% down the screen.
    const camTarget = Math.max(0, stack.length * BLOCK_H - (groundY - viewH * 0.42));
    cam += (camTarget - cam) * Math.min(1, dt * 6);

    for (const d of debris) {
      d.vy -= GRAVITY * dt;
      d.h += d.vy * dt;
      d.x += d.vx * dt;
      d.rot += d.vr * dt;
    }
    debris = debris.filter(d => groundY - d.h + cam < viewH + 300);

    for (const f of floaters) f.life -= dt * 0.9;
    floaters = floaters.filter(f => f.life > 0);
    for (const r of rings) r.life -= dt * 2.2;
    rings = rings.filter(r => r.life > 0);
  }

  // ---------- render ----------
  const screenY = level => groundY - (level + 1) * BLOCK_H + cam;

  function drawBlock(x, y, w, h, hue) {
    ctx.fillStyle = `hsl(${hue},60%,55%)`;
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = `hsl(${hue},75%,70%)`;
    ctx.fillRect(x, y, w, 4);
    ctx.fillStyle = `hsl(${hue},55%,42%)`;
    ctx.fillRect(x, y + h - 3, w, 3);
  }

  function render() {
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);

    const topLevel = stack.length;
    const h = hueOf(topLevel);
    const bg = ctx.createLinearGradient(0, 0, 0, viewH);
    bg.addColorStop(0, `hsl(${(h + 180) % 360},35%,18%)`);
    bg.addColorStop(1, `hsl(${(h + 210) % 360},40%,34%)`);
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, viewW, viewH);

    ctx.save();
    ctx.translate(offX, 0);

    // Base pedestal runs off the bottom of the screen.
    const base = stack[0];
    const baseY = screenY(0);
    drawBlock(base.x, baseY, base.w, Math.max(BLOCK_H, viewH - baseY + 10), hueOf(0));

    const firstVisible = Math.max(1, Math.floor((cam - 40) / BLOCK_H));
    for (let i = firstVisible; i < stack.length; i++) {
      const b = stack[i];
      const y = screenY(i);
      if (y > viewH) continue;
      drawBlock(b.x, y, b.w, BLOCK_H, hueOf(i));
    }

    if (cur) drawBlock(cur.x, screenY(stack.length), cur.w, BLOCK_H, hueOf(stack.length));

    for (const d of debris) {
      const y = groundY - d.h + cam;
      ctx.save();
      ctx.translate(d.x + d.w / 2, y + BLOCK_H / 2);
      ctx.rotate(d.rot);
      drawBlock(-d.w / 2, -BLOCK_H / 2, d.w, BLOCK_H, d.hue);
      ctx.restore();
    }

    for (const r of rings) {
      const grow = (1 - r.life) * 14;
      ctx.strokeStyle = `rgba(255,255,255,${r.life * 0.9})`;
      ctx.lineWidth = 2;
      ctx.strokeRect(r.x - grow, screenY(r.level) - grow, r.w + grow * 2, BLOCK_H + grow * 2);
    }

    ctx.textAlign = 'center';
    ctx.font = '700 18px system-ui, -apple-system, "Segoe UI", sans-serif';
    for (const f of floaters) {
      ctx.fillStyle = `rgba(255,255,255,${Math.min(1, f.life * 1.5)})`;
      ctx.fillText(f.text, f.x, screenY(f.level) - 14 - (1 - f.life) * 30);
    }

    ctx.restore();
  }

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
